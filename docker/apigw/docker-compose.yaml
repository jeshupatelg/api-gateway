services:
  api-gateway:
    image: jeshupatelg/apigw-homeserver:${APIGW_VERSION}
    container_name: api-gateway
    # entrypoint: ["java", "-Dlogging.config=/config/logback.xml", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-jar", "/opt/api-gateway/app.jar"]
    ports:
      - "${GATEWAY_HOST_IP}:${GATEWAY_HOST_PORT}:8080"   # expose gateway externally
    #   - "5005:5005"                 # expose JVM debug port
    environment:
      # Same vars as app/common/src/main/resources/application.yaml; override via shell or .env beside this file.
      SERVER_PORT: ${SERVER_PORT:-8080}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-apigw-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    volumes:
      - type: bind
        source: ./routes.yaml
        target: /config/routes.yaml
        read_only: true
      - type: bind
        source: ./security.yaml
        target: /config/security.yaml
        read_only: true
      - type: bind
        source: ./logback.xml
        target: /config/logback.xml
        read_only: true
    networks:
      - gateway_net
    restart: unless-stopped

networks:
  gateway_net:
    external: true