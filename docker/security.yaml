# Mounted at /config/security.yaml (see apigw-compose.yaml).
# Overrides gateway.security.* from application.yaml when present.
#
# Align path patterns with spring.cloud.gateway routes in routes.yaml.
# Realm role names are matched case-insensitively to Keycloak realm roles.

gateway:
  security:
    public-paths:
      - /keycloak/**
      - /oauth2/**
      - /login/oauth2/code/**
      - /actuator/health
      - /actuator/info
      - /favicon.ico
    role-path-access:
      admin:
        - /**
      devops:
        - /jenkins
        - /jenkins/**
      IT:
        - /keycloak
        - /keycloak/**