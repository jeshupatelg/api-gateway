server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  reactive:
    session:
      # Keep Gateway WebSession Timeout and Keycloak SSO Session Idle aligned
      timeout: ${GATEWAY_SESSION_TIMEOUT:30m}

spring:
  application:
    name: api-gateway
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://${APIGW_POSTGRES_HOST:localhost}:${APIGW_POSTGRES_PORT:5432}/${APIGW_POSTGRES_DB:apigateway}}
    username: ${APIGW_POSTGRES_USER:postgres}
    password: ${APIGW_POSTGRES_PASSWORD:postgres}
    pool:
      initial-size: ${R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${R2DBC_POOL_MAX_SIZE:20}
      max-idle-time: ${R2DBC_POOL_MAX_IDLE_TIME:30m}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_URL:jdbc:postgresql://${APIGW_POSTGRES_HOST:localhost}:${APIGW_POSTGRES_PORT:5432}/${APIGW_POSTGRES_DB:apigateway}}
    user: ${APIGW_POSTGRES_USER:postgres}
    password: ${APIGW_POSTGRES_PASSWORD:postgres}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:apigw-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
  cloud:
    gateway:
      forwarded:
        enabled: false
      default-filters:
        # Uniformly request origin-keying for all pages
        - AddResponseHeader=Origin-Agent-Cluster, ?1
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        wiretap: true
      httpserver:
        wiretap: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    with-credentials: true
    csrf:
      enabled: false

# Authorization default static fallback rules
gateway:
  security:
    public-paths:
      - /keycloak/**
      - /oauth2/**
      - /login/oauth2/code/**
      - /actuator/health
      - /actuator/info
      - /favicon.ico
    role-path-access:
      admin:
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /api/v1/config/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
api-gateway:
  firewall:
    relaxed-patterns: "/jenkins/administrativeMonitor/hudson.diagnosis.ReverseProxySetupMonitor/testForReverseProxySetup/"
  exchange:
    logging:
      enabled: false